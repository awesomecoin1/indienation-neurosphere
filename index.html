<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon: #00ff88; --bg: #000; }
        body { margin: 0; background: #000; color: var(--neon); font-family: 'Courier New', monospace; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 1s; }
        #auth-screen, #main-vault { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .vault-card { border: 2px solid var(--neon); border-radius: 20px; padding: 30px; width: 85%; max-width: 400px; box-shadow: 0 0 30px rgba(0, 255, 136, 0.2); text-align: center; }
        input { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 12px; width: 90%; margin: 10px 0; border-radius: 5px; text-align: center; }
        button { background: var(--neon); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; border-radius: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .balance { font-size: 2.2rem; margin: 20px 0; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--neon); }
    </style>
</head>
<body>
    <div id="splash">
        <h1 style="letter-spacing: 15px; font-size: 2.5rem;">NEUROSPHERE</h1>
        <p>INITIALIZING AI GUARD...</p>
    </div>

    <div id="auth-screen">
    <div id="aura-bg" style="position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(0,255,136,0.3) 0%, rgba(0,0,0,0) 70%); z-index:-1; transition:all 2s ease;"></div>
        <div class="vault-card">
            <div id="my-qr-area" style="display:none; background:white; padding:10px; margin:10px auto; width:150px;"></div>
            <div id="msg-box" style="display:none; margin-top:20px; border-top:1px solid var(--neon); padding-top:10px;"> 
                <p style="font-size:0.7rem;">SEND MESSAGE TO PIONEER:</p> 
                <textarea id="pioneer-msg" style="width:90%; background:#111; color:var(--neon); border:1px solid var(--neon);"></textarea> 
                <button onclick="sendMessage()" style="font-size:0.6rem; padding:5px;">SEND ENCRYPTED MSG</button> 
            </div>
            <div id="reader" style="width: 100%; display:none; margin-top:20px; border:1px solid var(--neon);"></div> 
            <button id="scan-btn" onclick="toggleScanner()" style="background:transparent; border:1px solid var(--neon); color:var(--neon); font-size:0.7rem; margin-top:10px;">SCAN PIONEER IID</button>
            <h2>PIONEER ACTIVATION</h2>
            <input type="text" id="reg-name" placeholder="FULL NAME">
            <input type="date" id="reg-dob">
            <button onclick="handleRegister()">ACTIVATE IDENTITY</button>
        </div>
    </div>

    <div id="main-vault">
    <div id="aura-bg" style="position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(0,255,136,0.3) 0%, rgba(0,0,0,0) 70%); z-index:-1; transition:all 2s ease;"></div>
        <div class="vault-card">
            <div id="my-qr-area" style="display:none; background:white; padding:10px; margin:10px auto; width:150px;"></div>
            <div id="msg-box" style="display:none; margin-top:20px; border-top:1px solid var(--neon); padding-top:10px;"> 
                <p style="font-size:0.7rem;">SEND MESSAGE TO PIONEER:</p> 
                <textarea id="pioneer-msg" style="width:90%; background:#111; color:var(--neon); border:1px solid var(--neon);"></textarea> 
                <button onclick="sendMessage()" style="font-size:0.6rem; padding:5px;">SEND ENCRYPTED MSG</button> 
            </div>
            <div id="reader" style="width: 100%; display:none; margin-top:20px; border:1px solid var(--neon);"></div> 
            <button id="scan-btn" onclick="toggleScanner()" style="background:transparent; border:1px solid var(--neon); color:var(--neon); font-size:0.7rem; margin-top:10px;">SCAN PIONEER IID</button>
            <p>HOLDER: <span id="display-name">...</span></p>
            <div class="balance" id="eur-val">€99.999,9997</div>
            <p id="idr-val">Rp 1.725.000.000</p>
            <div id="msg-box" style="display:none; margin-top:20px; border-top:1px solid var(--neon); padding-top:10px;"> 
                <p style="font-size:0.7rem;">SEND MESSAGE TO PIONEER:</p> 
                <textarea id="pioneer-msg" style="width:90%; background:#111; color:var(--neon); border:1px solid var(--neon);"></textarea> 
                <button onclick="sendMessage()" style="font-size:0.6rem; padding:5px;">SEND ENCRYPTED MSG</button> 
            </div>
            <div id="reader" style="width: 100%; display:none; margin-top:20px; border:1px solid var(--neon);"></div> 
            <div style="display:flex; gap:5px;"> 
                <button onclick="toggleMyQR()" style="font-size:0.6rem; background:#444; color:white;">SHOW MY QR</button> 
                <button id="scan-btn" onclick="toggleScanner()" style="font-size:0.6rem;">SCAN OTHERS</button> 
            </div>
    <button onclick="setupInheritance()" style="background:transparent; border:1px solid #ffaa00; color:#ffaa00; font-size:0.6rem; margin-bottom:10px;">PREPARE INHERITANCE</button>
            <button onclick="handleLogout()" style="background:transparent; border:1px solid red; color:red; width:auto; padding:5px 15px;">LOGOUT</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://seytfjndfvjrneaupvry.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNleXRmam5kZnZqcm5lYXVwdnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwNTMwMzMsImV4cCI6MjA4NjYyOTAzM30.uEQOi2kJvgm6P94_66yiMmsaB1eBO0tga8CjlaT9bz4";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = () => {
            setTimeout(() => {
                const s = document.getElementById('splash');
                s.style.opacity = '0';
                setTimeout(() => { 
                    s.style.display = 'none'; 
                    const iid = localStorage.getItem('NEURO_IID');
                    if(iid) {
                        document.getElementById('main-vault').style.display = 'flex';
                        document.getElementById('display-name').innerText = localStorage.getItem('NEURO_NAME');
                        startPulse();
                    } else {
                        document.getElementById('auth-screen').style.display = 'flex';
                    }
                }, 1000);
            }, 3000);
        };

        function startPulse() {
            setInterval(() => {
                const val = 99999.9997 + (Math.random() * 0.0002);
                document.getElementById('eur-val').innerText = "€" + val.toLocaleString('de-DE', {minimumFractionDigits: 4});
                document.getElementById('idr-val').innerText = "Rp " + (val * 17250).toLocaleString('id-ID');
            }, 1000);
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const dob = document.getElementById('reg-dob').value;
            if(!name || !dob) return alert("Data tidak lengkap");
            const iid = "IID-GAG" + Math.floor(Math.random() * 900000);
            const { error } = await sb.from('citizens').insert([{ iid, full_name: name, birth_date: dob }]);
            if(error) return alert("Sync Error: " + error.message);
            localStorage.setItem('NEURO_IID', iid);
            localStorage.setItem('NEURO_NAME', name);
            location.reload();
        }

function toggleMyQR() { 
    const area = document.getElementById("my-qr-area"); 
    if(area.style.display === "none") { 
        area.style.display = "block"; 
        area.innerHTML = ""; 
        new QRCode(area, { text: localStorage.getItem("NEURO_IID"), width: 150, height: 150 }); 
    } else { area.style.display = "none"; } 
} 

let html5QrCode; 
function toggleScanner() { 
    const reader = document.getElementById("reader"); 
    if (reader.style.display === "none") { 
        reader.style.display = "block"; 
        html5QrCode = new Html5Qrcode("reader"); 
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => { 
            validatePioneer(txt); 
            stopScanning(); 
        }); 
    } else { stopScanning(); } 
} 
function stopScanning() { 
    if(html5QrCode) html5QrCode.stop().then(() => { document.getElementById("reader").style.display = "none"; }); 
} 
async function validatePioneer(iid) { 
    document.getElementById("msg-box").style.display = "block"; 
    localStorage.setItem("LAST_SCANNED_IID", iid);
    const { data } = await sb.from("citizens").select("full_name").eq("iid", iid).single(); 
    if(data) alert("VERIFIED: " + data.full_name); 
    else alert("INVALID PIONEER ID"); 
}
function setupInheritance() { 
    const iid = localStorage.getItem("NEURO_IID"); 
    const name = localStorage.getItem("NEURO_NAME"); 
    const bal = localStorage.getItem("NEURO_BAL"); 
    const inheritanceData = btoa(JSON.stringify({ iid, name, bal, date: new Date().toISOString() })); 
    const area = document.getElementById("my-qr-area"); 
    area.style.display = "block"; 
    area.innerHTML = "<p style-color:black;font-size:10px>INHERITANCE KEY</p>"; 
    new QRCode(area, { text: "NEURO-LEGACY:" + inheritanceData, width: 150, height: 150 }); 
    alert("Inheritance QR Generated. Save this for your heirs."); 
}
        function handleLogout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
