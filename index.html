<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSphere | Walking Wallet NFT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #00ff41; font-family: 'Courier New', monospace; }
        .neon-glow { border: 1px solid #00ff41; box-shadow: 0 0 15px #00ff41; }
        .nft-card { background: linear-gradient(145deg, #0a0a0a, #1a1a1a); }
    </style>
</head>
<body class="p-4 flex justify-center items-center min-h-screen">
    <div class="max-w-md w-full nft-card neon-glow p-8 rounded-3xl relative overflow-hidden">
        <div class="absolute top-0 right-0 p-2 text-[8px] bg-green-900 text-black font-bold">AI GUARD ACTIVE</div>

        <h1 class="text-center font-black text-2xl tracking-tighter mb-2 italic">NEUROSPHERE</h1>
        <p class="text-[10px] text-center text-gray-500 mb-8 tracking-widest uppercase">Walking Wallet NFT / TM Identity</p>

        <div class="flex justify-center mb-8">
            <div class="w-48 h-48 bg-white p-2 rounded-lg" id="qrcode">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=IID-KADI22T0M-TM-€1540" alt="Sovereign QR">
            </div>
        </div>

        <div class="text-center border-t border-b border-green-900 py-4 mb-6">
            <p class="text-[10px] text-gray-400">CURRENT BALANCE (IND-EUR)</p>
            <h2 class="text-4xl font-bold text-white">€1.540,00</h2>
            <p class="text-[9px] text-blue-400 mt-1 uppercase tracking-widest">Stable Asset Locked</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="alert('Scan Mode Aktif: Dekatkan HP Anda ke QR Penerima')" class="py-3 border border-green-500 hover:bg-green-500 hover:text-black font-bold text-xs rounded-full transition">KIRIM (SEND)</button>
            <button onclick="alert('IID Anda: IID-KADI22T0M\nSiap menerima distribusi TM')" class="py-3 border border-green-500 hover:bg-green-500 hover:text-black font-bold text-xs rounded-full transition">TERIMA (RECEIVE)</button>
        </div>

        <div class="mt-8 text-[8px] text-gray-600 space-y-1">
            <p>HOLDER: INDIE-Founder</p>
            <p>IID: IID-KADI22T0M / SSOT: SYNCED</p>
            <p>ALGO: SHA256 / AURALANG COMPILER v1.0</p>
        </div>
    </div>
</body>
</html>
