<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Wallet | NeuroSphere</title>
    <style>
        body { background: #000; color: #00ff96; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .wallet-container { border: 2px solid #00ff96; border-radius: 15px; padding: 20px; max-width: 450px; margin: auto; box-shadow: 0 0 15px rgba(0,255,150,0.3); }
        .header { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .id-badge { background: #00ff96; color: #000; padding: 2px 10px; font-weight: bold; border-radius: 5px; }
        .balance-card { background: rgba(255,215,0,0.1); border: 1px solid #ffd700; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .balance-main { font-size: 2em; color: #ffd700; font-weight: bold; }
        .grid-assets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .asset-box { border: 1px solid #333; padding: 10px; border-radius: 8px; text-align: center; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-send { background: #8a2be2; color: #fff; }
        .btn-receive { background: #00ff96; color: #000; }
        .qr-area { text-align: center; margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .hash-text { font-size: 0.6em; color: #555; word-break: break-all; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="wallet-container">
        <div class="header">
            <span class="id-badge">IID-001</span>
            <div style="margin-top: 5px; font-size: 0.8em;">INDIE-Founder Authority</div>
        </div>

        <div class="balance-card">
            <div style="font-size: 0.8em; color: #888;">TOTAL LIVING VALUE (IND-EUR)</div>
            <div class="balance-main">€100.000,00</div>
            <div style="font-size: 0.7em; color: #ffd700;">STABLE ANCHOR VERIFIED</div>
        </div>

        <div class="grid-assets">
            <div class="asset-box">
                <div style="font-size: 0.7em; color: #888;">ENPE (E-COIN)</div>
                <div style="color: #fff;">100.000.000</div>
            </div>
            <div class="asset-box">
                <div style="font-size: 0.7em; color: #888;">LUV (LOVELY)</div>
                <div style="color: #fff;">1.000.000</div>
            </div>
        </div>

        <div class="btn-group">
            <a href="#" class="btn btn-send">SEND ASSET</a>
            <a href="#" class="btn btn-receive">RECEIVE / SCAN</a>
        </div>

        <div class="qr-area">
            <div style="width: 120px; height: 120px; border: 2px solid #00ff96; margin: auto; display: flex; align-items: center; justify-content: center; background: #fff;">
                <span style="color: #000; font-size: 0.7em;">IDENTITY QR</span>
            </div>
            <div class="hash-text">
                ENC: NEUROLANG-V1 | SSOT: AURALANG<br>
                AUTH: $(date +%Y%m%d)-NS-WAL-001
            </div>
        </div>
    </div>
</body>
</html>
