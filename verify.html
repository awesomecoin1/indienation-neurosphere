<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSphere | Verify Identity</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 50px; }
        .box { border: 2px solid #22c55e; padding: 30px; border-radius: 20px; display: inline-block; background: #1e293b; }
        .valid { color: #22c55e; font-weight: bold; font-size: 1.5rem; }
        .iid { color: #94a3b8; font-family: monospace; }
    </style>
</head>
<body>
    <div class="box">
        <div id="status-icon">🔍</div>
        <div id="result">Memproses Verifikasi...</div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const iid = params.get('iid');
        const res = document.getElementById('result');
        const icon = document.getElementById('status-icon');

        if (iid === 'IID-N2M20E127' || iid === 'IID-M3OLX5ED2') {
            icon.innerHTML = "✅";
            res.innerHTML = `<p class="valid">IDENTITAS VALID</p>
                             <p>Holder: <b>INDIE-Founder</b></p>
                             <p class="iid">IID: ${iid}</p>
                             <p>Status: Active Sovereign</p>
                             <p>Anchor: €100.000,00</p>`;
        } else {
            icon.innerHTML = "❌";
            res.innerHTML = `<p style="color:#ef4444">IDENTITAS TIDAK DITEMUKAN</p>`;
        }
    </script>
</body>
</html>
