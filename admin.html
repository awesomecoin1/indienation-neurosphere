<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSphere | Transaction Engine</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .vault-box { border: 2px solid #00ff41; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 0 10px #00ff41; }
        input { background: #111; border: 1px solid #00ff41; color: #00ff41; padding: 12px; width: 90%; margin: 10px 0; border-radius: 4px; }
        button { background: #00ff41; color: #000; border: none; padding: 12px; width: 95%; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .ledger-log { background: #000; border: 1px solid #222; padding: 10px; height: 120px; overflow-y: auto; font-size: 11px; color: #008f11; margin-top: 15px; }
    </style>
</head>
<body>
    <h2># NEUROSPHERE_IID_VAULT</h2>
    <div class="vault-box">
        <div>CURRENT_IID: <strong id="user-iid">GENERATING...</strong></div>
        <div style="font-size: 10px; opacity: 0.7;">STATUS: SOVEREIGN_IDENTITY_LOCKED</div>
    </div>

    <div class="vault-box">
        <h3>TRANSACTION_ENGINE (0-1000 EUR)</h3>
        <input type="text" id="target-id" placeholder="RECIPIENT_IID (e.g. IID-XXXX)">
        <input type="number" id="tx-amount" placeholder="AMOUNT IND-EUR (Max 1000)" step="0.01">
        <button onclick="sendFunds()">EXECUTE_SIGNED_TRANSFER</button>
    </div>

    <div id="tx-ledger" class="ledger-log">Awaiting first transaction...</div>

    <script>
        // IDENTITY_LOCK Logic: Memastikan ID tetap konsisten
        const initIdentity = () => {
            let iid = localStorage.getItem('ns_iid');
            if (!iid) {
                iid = 'IID-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                localStorage.setItem('ns_iid', iid);
            }
            document.getElementById('user-iid').innerText = iid;
            return iid;
        };

        // TRANSACTION_ENGINE: Validasi & Signing (Auralang Protocol)
        function sendFunds() {
            const myIid = initIdentity();
            const target = document.getElementById('target-id').value;
            const amt = parseFloat(document.getElementById('tx-amount').value);
            const ts = new Date().toISOString();

            if (!target || isNaN(amt) || amt < 0 || amt > 1000) {
                alert("ERR: INVALID_AMOUNT_OR_IID (Range 0-1000)");
                return;
            }

            // Generate Proof of Transaction (TXID & SIG)
            const hashData = btoa(`${myIid}${target}${amt}${ts}`);
            const txid = "0x" + hashData.substr(0, 16);
            const sig = "SIG-" + hashData.substr(16, 24);

            const record = `<div>[${ts}] TX: ${txid} | SENT: €${amt} TO: ${target} | SIG: ${sig}</div>`;
            document.getElementById('tx-ledger').innerHTML = record + document.getElementById('tx-ledger').innerHTML;
            
            alert(`TRANSACTION_SUCCESS!\nTXID: ${txid}\nSIGNATURE: ${sig}`);
        }

        window.onload = initIdentity;
    </script>
</body>
</html>
