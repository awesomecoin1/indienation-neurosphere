<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Founder Admin Panel - NeuroSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; }
        .founder-border { border: 2px solid #00ff41; box-shadow: 0 0 15px #00ff41; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">NEUROSPHERE CONTROL CENTER</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="founder-border p-6 rounded-lg bg-black">
                <h2 class="text-xs uppercase tracking-widest mb-4">Founder Master Identity</h2>
                <canvas id="founder-qr" class="mx-auto bg-white p-2"></canvas>
                <p class="text-center mt-4 text-sm font-bold">IID-GHYT3EPKB</p>
                <p class="text-[10px] text-center opacity-50">INDIE-FOUNDER AUTHENTICATED</p>
            </div>

            <div class="border border-green-900 p-6 rounded-lg">
                <h2 class="text-xs mb-4">LIVE TRANSACTION FEED</h2>
                <div class="text-[10px] space-y-2">
                    <p class="text-green-400">[20:05:23] TX-TEST-001: SUCCESS</p>
                    <p class="text-white">NET: €850.0 | DONATION: €150.0</p>
                    <hr class="border-green-900">
                    <p class="animate-pulse">_WAITING FOR NEXT SCAN...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate Founder Master QR on Load
        window.onload = function() {
            const qrCanvas = document.getElementById('founder-qr');
            QRCode.toCanvas(qrCanvas, "https://indienation-neurosphere.vercel.app/admin/verify?id=IID-GHYT3EPKB", { width: 180 });
        }
    </script>
</body>
</html>
<script>
function triggerEmergency() {
    const confirmation = confirm("WARNING: This will freeze the ENTIRE NeuroSphere ecosystem. Only INDIE-Founder can undo this. Proceed?");
    if(confirmation) {
        alert("PROTOKOL OMEGA ACTIVATED. All assets locked.");
        // Logika AI Guard Shutdown akan diproses di sini
    }
}
</script>
<div id="qr-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border:2px solid #00ff00; z-index:1000; text-align:center; color:#000;">
    <h3>SOVEREIGN QR</h3>
    <div id="identity-qr" style="margin:10px auto; display:inline-block;"></div>
    <br><button onclick="closeQR()" style="padding:5px 20px; cursor:pointer;">CLOSE</button>
</div>
<div id="qr-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999;" onclick="closeQR()"></div>

<script>
function showQR() {
    const identity = {
        name: localStorage.getItem('ns_name') || "INDIE-Founder",
        iid: localStorage.getItem('ns_iid') || "IID-M3OLX5ED2",
        balance: localStorage.getItem('ns_balance') || "1540",
        status: "ACTIVE_SOVEREIGN"
    };
    document.getElementById('identity-qr').innerHTML = "";
    new QRCode(document.getElementById('identity-qr'), JSON.stringify(identity));
    document.getElementById('qr-modal').style.display = 'block';
    document.getElementById('qr-overlay').style.display = 'block';
}
function closeQR() {
    document.getElementById('qr-modal').style.display = 'none';
    document.getElementById('qr-overlay').style.display = 'none';
}
</script>
