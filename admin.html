<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NeuroSphere | Admin Sync</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .vault-card { border: 1px solid #00ff00; padding: 15px; margin-bottom: 15px; }
        .btn-sync { background: #00ff00; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        .log { font-size: 10px; color: #008f11; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>
    <h2># ADMIN_DASHBOARD</h2>
    <div class="vault-card">
        <div>HOLDER: <span id="h-name">...</span></div>
        <div>IID: <span id="h-iid">...</span></div>
        <div>BALANCE: €<span id="h-bal">...</span></div>
    </div>

    <button class="btn-sync" onclick="syncLedger()">REFRESH_LEDGER_SYNC</button>

    <div class="log" id="sync-log">Ready for manual sync...</div>

    <script>
        function loadData() {
            // Mengambil data terkunci dari sistem utama
            const name = localStorage.getItem('ns_name') || "INDIE-Founder";
            const iid = localStorage.getItem('ns_iid') || "IID-M3OLX5ED2";
            const bal = localStorage.getItem('ns_balance') || "1540";

            document.getElementById('h-name').innerText = name;
            document.getElementById('h-iid').innerText = iid;
            document.getElementById('h-bal').innerText = parseFloat(bal).toLocaleString('de-DE', {minimumFractionDigits: 2});
        }

        function syncLedger() {
            const log = document.getElementById('sync-log');
            log.innerHTML = "Connecting to AI Guard...<br>" + log.innerHTML;
            
            setTimeout(() => {
                // Memastikan data tetap konsisten (Persistence)
                localStorage.setItem('ns_name', "INDIE-Founder");
                localStorage.setItem('ns_iid', "IID-M3OLX5ED2");
                localStorage.setItem('ns_balance', "1540");
                
                loadData();
                log.innerHTML = "[SUCCESS] Data Synced with SSOT Ledger. Identity Locked.<br>" + log.innerHTML;
                alert("Ledger Synced! IID: IID-M3OLX5ED2 is Consistent.");
            }, 800);
        }

        window.onload = loadData;
    </script>
</body>
</html>
