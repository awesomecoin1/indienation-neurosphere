<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDIE-SCAN | NeuroSphere Explorer</title>
    <style>
        body { background: #000; color: #00ff88; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .scanner-box { border: 2px solid #00ff88; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 0 15px #00ff88; text-align: center; }
        input { background: #001a0f; border: 1px solid #00ff88; color: #00ff88; padding: 10px; width: 80%; margin: 10px 0; outline: none; text-align: center; }
        .result { margin-top: 20px; padding: 15px; border-top: 1px dashed #00ff88; display: none; text-align: left; }
        .status-valid { color: #00ff88; font-weight: bold; }
        button { background: #00ff88; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔎 INDIE-SCAN</h1>
    <p>NeuroSphere Sovereign Explorer</p>
    
    <div class="scanner-box">
        <input type="text" id="iidInput" placeholder="MASUKKAN IID (Contoh: IID-2026-0000011)">
        <br>
        <button onclick="scanIID()">VALIDASI IID</button>
        
        <div id="resultBox" class="result">
            <p>IID: <span id="resIID"></span></p>
            <p>HOLDER: <span id="resHolder">SOVEREIGN PIONEER</span></p>
            <p>VALUE: <span id="resValue">€100,000.0000</span></p>
            <p>GUARD: <span class="status-valid">VERIFIED BY AI GUARD V1</span></p>
            <p>STATUS: <span id="resStatus">ACTIVE</span></p>
        </div>
    </div>

    <script>
        function scanIID() {
            const iid = document.getElementById('iidInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            if (/^IID-2026-\d{7}$/.test(iid) || iid === "IID-GAG08430G") {
                document.getElementById('resIID').innerText = iid;
                resultBox.style.display = 'block';
                // Animasi Scan
                document.querySelector('.scanner-box').style.borderColor = '#fff';
                setTimeout(() => document.querySelector('.scanner-box').style.borderColor = '#00ff88', 200);
            } else {
                alert("❌ IID TIDAK DIKENALI ATAU FORMAT SALAH");
                resultBox.style.display = 'none';
            }
        }
    </script>
    <br>
    <a href="/" style="color: #00ff88; text-decoration: none;">[ KEMBALI KE VAULT ]</a>
</body>
</html>
