<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="30">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSphere - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; }
        .neon-border { border: 1px solid #38bdf8; box-shadow: 0 0 10px #38bdf8; }
    </style>
</head>
<body class="p-6">
    <header class="mb-8 border-b border-slate-700 pb-4">
        <h1 class="text-2xl font-bold text-sky-400">🛡️ FOUNDER COMMAND CENTER</h1>
        <p class="text-slate-400 text-sm">Real-time AI Guard & Treasury Monitor</p>
    </header>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="p-6 rounded-xl bg-slate-800 neon-border">
            <h2 class="text-lg font-semibold mb-4 text-emerald-400">Status Sistem</h2>
            <div class="flex justify-between mb-2"><span>Status AI Guard:</span><span class="text-emerald-400">ONLINE</span></div>
            <div class="flex justify-between"><span>Memory Use:</span><span class="text-sky-300">1.9G / 10G</span></div>
        </div>
        <div class="p-6 rounded-xl bg-slate-800 border border-amber-500/50">
            <h2 class="text-lg font-semibold mb-4 text-amber-400">🌊 Pool Donasi (15%)</h2>
            <div class="text-3xl font-bold mb-2">SECURE</div>
        </div>
    </div>
</body>
</html>
