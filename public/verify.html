<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSphere - Cryptographic Verifier</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl-fast.min.js"></script>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; text-align: center; line-height: 1.6; }
        .box { border: 2px solid #00ff00; padding: 30px; display: inline-block; max-width: 600px; background: #111; box-shadow: 0 0 20px rgba(0,255,0,0.3); border-radius: 10px; }
        textarea { background: #000; color: #00ff00; border: 1px solid #00ff00; width: 100%; height: 150px; font-family: 'Courier New'; font-size: 12px; margin-bottom: 20px; padding: 10px; }
        .status { font-weight: bold; padding: 15px; margin-top: 20px; border-radius: 5px; }
        .valid { background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; }
        .invalid { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff0000; color: #ff0000; }
        button { background: #00ff00; color: #000; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #00cc00; }
    </style>
</head>
<body>
    <h1>🛡️ SOVEREIGN VERIFIER v1.0</h1>
    <div class="box">
        <p>Tempel seluruh isi file <b>.txt</b> sertifikat Anda di bawah ini untuk audit kriptografi Ed25519:</p>
        <textarea id="certInput" placeholder="Copy-paste sertifikat di sini..."></textarea>
        <button onclick="verifySovereign()">AUDIT CERTIFICATE</button>
        <div id="status"></div>
    </div>

    <script>
        async function verifySovereign() {
            const input = document.getElementById('certInput').value;
            const statusDiv = document.getElementById('status');
            
            try {
                // 1. Ekstrak Signature dan Konten (Pisahkan metadata dari data asli)
                const parts = input.split('--- CRYPTOGRAPHIC AUTHENTICATION ---');
                if (parts.length < 2) throw new Error("Format sertifikat tidak valid.");
                
                const message = parts[0].trim();
                const metadata = parts[1];
                
                const sigMatch = metadata.match(/SIGNATURE\s*:\s*([^\n\r]+)/);
                if (!sigMatch) throw new Error("Signature tidak ditemukan.");
                
                const signatureBase64 = sigMatch[1].trim();
                const signature = nacl.util.decodeBase64(signatureBase64);
                
                // 2. Ambil Public Key dari Repository
                const pubKeyResponse = await fetch('founder.pub');
                const pubKeyText = await pubKeyResponse.text();
                
                // Ekstrak Raw Key dari format PEM
                const pubKeyBase64 = pubKeyText.replace(/-----BEGIN PUBLIC KEY-----|-----END PUBLIC KEY-----|\n|\r/g, "");
                const publicKeyFull = nacl.util.decodeBase64(pubKeyBase64);
                
                // Ed25519 public key adalah 32 byte terakhir dari struktur ASN.1 (untuk kunci mentah)
                const publicKey = publicKeyFull.slice(-32); 

                // 3. Verifikasi Matematis
                const msgUint8 = nacl.util.decodeUTF8(message);
                const isValid = nacl.sign.detached.verify(msgUint8, signature, publicKey);

                if (isValid) {
                    statusDiv.innerHTML = "<div class='status valid'>✅ VERIFIED: AUTHENTIC SOVEREIGN ASSET<br><small>Signature Valid via Ed25519 Digital Proof</small></div>";
                } else {
                    statusDiv.innerHTML = "<div class='status invalid'>❌ FAILED: INVALID SIGNATURE<br><small>Data telah dimodifikasi atau Signature palsu.</small></div>";
                }
            } catch (e) {
                statusDiv.innerHTML = "<div class='status invalid'>⚠️ ERROR: " + e.message + "</div>";
            }
        }
    </script>
</body>
</html>
